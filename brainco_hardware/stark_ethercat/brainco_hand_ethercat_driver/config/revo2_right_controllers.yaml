# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Controllers for the right hand
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    right_touch_state_broadcaster:
      type: brainco_hand_touch_broadcaster/TouchStateBroadcaster

    right_revo2_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

right_touch_state_broadcaster:
  ros__parameters:
    hand_name: right
    topic_name: /right_touch_states
    sensor_names:
      - right_thumb_touch
      - right_index_touch
      - right_middle_touch
      - right_ring_touch
      - right_pinky_touch

# Revo2 Right Hand Configuration 
right_revo2_hand_controller:
  ros__parameters:
    joints:
      - right_thumb_metacarpal_joint
      - right_thumb_proximal_joint
      - right_index_proximal_joint
      - right_middle_proximal_joint
      - right_ring_proximal_joint
      - right_pinky_proximal_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
